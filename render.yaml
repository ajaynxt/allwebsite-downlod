services:
  - type: web
    name: allwebsite-downlod
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://allwebsite-downlod.onrender.com
      - key: FRONTEND_API_BASE_URL
        value: https://allwebsite-downlod.onrender.com
      - key: ALLOWED_HOSTS
        value: allwebsite-downlod.onrender.com,download.ajaynxt.com,localhost,127.0.0.1
      - key: ALLOWED_ORIGINS
        value: https://linkdownload.ajaynxt.com,https://ajaynxt.github.io
      - key: TRUST_PROXY
        value: "true"
      - key: ENABLE_HSTS
        value: "true"
